services:
  - type: web
    name: factoryguard
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: factoryguard
      - key: MONGODB_DNS_SERVERS
        value: ""
      - key: VLLM_BASE_URL
        sync: false
      - key: VLLM_MODEL
        sync: false
